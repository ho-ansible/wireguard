---

- name: wireguard | genkey | private key
  command: wg genkey
  register: wg_priv

- name: wireguard | genkey | set wg_privkey
  set_fact:
    wg_privkey: "{{ wg_priv.stdout }}"

- name: wireguard | genkey | public key
  command: wg pubkey
  args:
    stdin: "{{ wg_privkey }}"
  register: wg_pub

- name: wireguard | genkey | set wg_pubkey
  set_fact:
    wg_pubkey: "{{ wg_pub.stdout }}"

- name: wireguard | genkey | host_vars dir
  become: false
  file:
    path: "{{ wg_keyfile | dirname }}"
    state: directory
  delegate_to: localhost

- name: wireguard | genkey | save keys in host_vars
  become: false
  template:
    src: wg_keys.yml.j2
    dest: "{{ wg_keyfile }}"
    mode: 0640
  delegate_to: localhost
  notify: restart networkd

- name: wireguard | genkey | save keys for current use
  set_fact: 
    wg_keys_{{ wg_name }}:
      priv: "{{ wg_privkey }}"
      pub : "{{ wg_pubkey  }}"
    cacheable: yes
